<!-- Inicio de Sesión (Basado en Registro) -->
<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Iniciar Sesión - Plataforma de Capacitación</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1152d4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display min-h-screen">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
        <div
            class="flex items-center bg-white dark:bg-[#1c222d] p-4 pb-2 justify-between border-b border-[#dbdfe6] dark:border-[#2d3648]">
            <div
                class="text-[#111318] dark:text-white flex size-12 shrink-0 items-center justify-center cursor-pointer">
                <span class="material-symbols-outlined">arrow_back</span>
            </div>
            <h2 class="text-[#111318] dark:text-white text-lg font-bold leading-tight flex-1 text-center pr-12">Acceso
            </h2>
        </div>
        <main
            class="flex-1 flex flex-col items-center justify-start py-12 px-4 shadow-[inset_0_-2px_4px_rgba(0,0,0,0.05)]">
            <div class="w-full max-w-[480px]">
                <h1
                    class="text-[#111318] dark:text-white tracking-light text-[32px] font-bold leading-tight text-center pb-3 pt-6">
                    Bienvenido de nuevo</h1>
                <p class="text-[#616f89] dark:text-gray-400 text-base font-normal leading-normal pb-8 pt-1 text-center">
                    Ingresa tus credenciales para acceder a tu panel de capacitación.
                </p>
                <div
                    class="bg-white dark:bg-[#1c222d] rounded-xl shadow-lg border border-[#dbdfe6] dark:border-[#2d3648] p-8 space-y-4">
                    <div class="flex flex-col gap-1">
                        <label class="flex flex-col flex-1">
                            <p class="text-[#111318] dark:text-white text-sm font-medium leading-normal pb-2">Correo
                                Electrónico</p>
                            <input
                                class="form-input flex w-full rounded-lg text-[#111318] dark:text-white border border-[#dbdfe6] dark:border-[#2d3648] bg-white dark:bg-[#101622] h-12 p-[15px] text-base"
                                placeholder="nombre@empresa.com" type="email" />
                        </label>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="flex flex-col flex-1">
                            <div class="flex justify-between items-center pb-2">
                                <p class="text-[#111318] dark:text-white text-sm font-medium leading-normal">Contraseña
                                </p>
                                <a href="#" class="text-xs text-primary font-bold hover:underline">¿Olvidaste tu
                                    contraseña?</a>
                            </div>
                            <div class="relative">
                                <input
                                    class="form-input flex w-full rounded-lg text-[#111318] dark:text-white border border-[#dbdfe6] dark:border-[#2d3648] bg-white dark:bg-[#101622] h-12 p-[15px] text-base"
                                    placeholder="••••••••" type="password" />
                                <button class="absolute right-4 top-1/2 -translate-y-1/2 text-[#616f89]">
                                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                                </button>
                            </div>
                        </label>
                    </div>
                    <div class="pt-4">
                        <button
                            class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                            <span>Iniciar Sesión</span>
                            <span class="material-symbols-outlined">login</span>
                        </button>
                    </div>
                </div>
                <div class="py-8 text-center">
                    <p class="text-[#616f89] dark:text-gray-400 text-sm">
                        ¿No tienes una cuenta?
                        <a class="text-primary font-bold hover:underline" href="#">Regístrate aquí</a>
                    </p>
                </div>
            </div>
        </main>
        <div class="pb-10 px-4 text-center">
            <p class="text-[10px] text-[#616f89] dark:text-gray-500 uppercase tracking-widest leading-loose">
                Portal Empresarial Seguro © 2024 Heavy Mach Certs Inc.
            </p>
        </div>
    </div>
</body>

</html>
